<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine? 💝</title>
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    background: linear-gradient(135deg, #ffafbd, #ffc3a0);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    color: #ff4757;
}

.container {
    background: white;
    padding: 40px;
    border-radius: 20px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

h1 {
    margin-bottom: 20px;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: #ff6b6b;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

button:hover {
    background: #ff8787;
}

#noBtn {
    position: absolute;
}

#loveMeter {
    font-size: 28px;
    margin: 20px 0;
}

.floating {
    position: absolute;
    font-size: 24px;
    animation: float 15s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh) translateX(0); }
    100% { transform: translateY(-10vh) translateX(50px); }
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container" id="box">
    <h1 id="question">Do you like me?</h1>
    <div id="buttons">
        <button onclick="firstYes()">Yes</button>
        <button onclick="firstNo()">No</button>
    </div>
    <div id="loveMeter" class="hidden">100%</div>
</div>

<script>
let stage = 1;
let loveValue = 100;

const box = document.getElementById("box");
const question = document.getElementById("question");
const buttons = document.getElementById("buttons");
const loveMeter = document.getElementById("loveMeter");

function firstYes() {
    question.innerText = "I don't like you, I love you! ❤️";
    setTimeout(secondStage, 1500);
}

function firstNo() {
    question.innerText = "Be honesttt 😌";
}

function secondStage() {
    stage = 2;
    question.innerText = "How much do you love me?";
    buttons.innerHTML = `<button onclick="increaseLove()">This much! ❤️</button>`;
    loveMeter.classList.remove("hidden");
}

function increaseLove() {
    loveValue *= 2;
    loveMeter.innerText = loveValue + "%";
    if (loveValue > 5000) {
        question.innerText = "WOOOOW You love me that much?? 🥰🚀💝";
        setTimeout(thirdStage, 1500);
    }
}

function thirdStage() {
    stage = 3;
    question.innerText = "Will you be my Valentine...?";
    loveMeter.classList.add("hidden");
    buttons.innerHTML = `
        <button onclick="celebrate()">Yes! 💖</button>
        <button id="noBtn">No</button>
    `;
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", function() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });
}

function celebrate() {
    box.innerHTML = `
        <h1>Yay! I'm the luckiest person... 💖</h1>
        <p>Now come get your gift... 🎁💖🤗💝💋❤️💕</p>
    `;
}

function createFloating() {
    const emojis = ['❤️','💖','💝','💗','💓','🧸','🐻'];
    const el = document.createElement("div");
    el.classList.add("floating");
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (10 + Math.random()*10) + "s";
    el.innerText = emojis[Math.floor(Math.random()*emojis.length)];
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 15000);
}

setInterval(createFloating, 800);
</script>

</body>
</html>
