<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bestie 🤍</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #f1f3f5;
    font-family: 'Segoe UI', Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 42px;
    color: #212529; /* darker */
    margin-bottom: 10px;
}

p {
    font-size: 20px;
    color: #343a40; /* darker readable */
    margin-bottom: 40px;
}

button {
    padding: 14px 35px;
    font-size: 16px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    position: absolute;
    transition: 0.2s ease;
}

#yesBtn {
    background-color: #212529;
    color: white;
    left: 42%;
    top: 60%;
}

#noBtn {
    background-color: #ced4da;
    color: #212529;
    left: 55%;
    top: 60%;
}

#message {
    margin-top: 120px;
    font-size: 26px;
    color: #212529;
    display: none;
    font-weight: 500;
}
</style>
</head>

<body>

<h1>Bestie 🤍</h1>
<p>Will you be my Valentine?</p>

<button id="yesBtn" onclick="sayYes()">Yes 🤍</button>
<button id="noBtn">No</button>

<div id="message">
    You just made my whole year better 🤍✨
</div>

<script>
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", function() {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

function sayYes() {
    document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
